[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway-demo"
version = "0.1.0"
description = "Offline, simulated multi-provider streaming gateway for AD331"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "streamlit>=1.40,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
